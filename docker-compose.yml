name: lurah-online

services:
  # ---------------------------------------------------------------------------
  # Aplikasi Laravel (PHP-FPM)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: app
    image: lurah-online-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Jalankan migrasi otomatis saat container start
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      # Upload pengguna (storage/app/public) harus persisten
      - uploads:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    networks:
      - internal
    expose:
      - "9000"

  # ---------------------------------------------------------------------------
  # Web server (Caddy, HTTP-only — TLS diterminasi proxy di depan)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      target: web
    image: lurah-online-web:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      # Hanya HTTP — HTTPS diterminasi oleh proxy di depan (Cloudflare/Nginx)
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      # Upload pengguna di-mount ke path yang dilayani Caddy (public/storage)
      - uploads:/var/www/html/public/storage:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  uploads:
  app_logs:

networks:
  internal:
    driver: bridge
