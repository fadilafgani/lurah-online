; ---------------------------------------------------------------------------
; Konfigurasi PHP untuk produksi
; ---------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60

; Upload: validasi aplikasi max 5MB/file, beri ruang untuk multi-file + overhead
upload_max_filesize = 16M
post_max_size = 24M
max_file_uploads = 20

; Error hanya ke log container, jangan pernah ke browser
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

expose_php = Off
date.timezone = Asia/Jakarta

; ---------------------------------------------------------------------------
; OPcache — wajib untuk performa produksi
; ---------------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
; Kode di dalam image bersifat immutable, jadi stat file tidak perlu
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; ---------------------------------------------------------------------------
; Session (driver database, nilai ini untuk pengaman tambahan)
; ---------------------------------------------------------------------------
session.cookie_httponly = 1
session.use_strict_mode = 1
