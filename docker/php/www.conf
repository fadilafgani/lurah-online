[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

; Dynamic: hemat memori saat idle, tetap sanggup saat trafik naik.
; Naikkan max_children bila RAM VPS lebih besar (~40MB per child).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Log ke stdout/stderr container
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/1
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d ms %{kilo}M kb"

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

clear_env = no

; Endpoint status untuk monitoring (hanya dari dalam network Docker)
pm.status_path = /fpm-status
ping.path = /fpm-ping
